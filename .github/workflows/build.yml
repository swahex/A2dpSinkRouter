name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and run synthetic checks
        shell: pwsh
        run: ./tools/Build.ps1 -CheckAudioCore
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/A2dpSinkRouter-win-x64.zip
          (Get-FileHash artifacts/A2dpSinkRouter-win-x64.zip -Algorithm SHA256).Hash | Set-Content artifacts/SHA256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: A2dpSinkRouter-win-x64
          path: |
            artifacts/A2dpSinkRouter-win-x64.zip
            artifacts/SHA256.txt
          if-no-files-found: error
