name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate tag, test and package both deployment modes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./tools/Package.ps1 -ExpectedTag $env:RELEASE_TAG
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages
          path: artifacts/release/*
          if-no-files-found: error

  draft:
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: release
      - name: Create a draft for maintainer review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $pattern = '(?ms)^## ' + [regex]::Escape($version) + '\r?\n(?<notes>.*?)(?=^## |\z)'
          $section = [regex]::Match((Get-Content -LiteralPath CHANGELOG.md -Raw), $pattern)
          if (!$section.Success) { throw "No changelog entry for $version." }
          [IO.File]::WriteAllText((Join-Path $PWD 'release-notes.md'), $section.Groups['notes'].Value.Trim(), [Text.UTF8Encoding]::new($false))
          $assets = @(Get-ChildItem -LiteralPath release -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --verify-tag --draft --notes-file release-notes.md --title "A2DP Sink Router $version"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed. Existing releases are never overwritten.' }
